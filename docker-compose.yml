# EPR
#
#   Deploy (pull the published image):   docker compose up -d
#   Update:                              docker compose pull && docker compose up -d
#   Build from source instead (dev):     docker compose up -d --build
#
# On update the container is replaced, ./data is untouched, and pending DB
# migrations run automatically (with a pre-migration backup in ./data/backups/).

services:
  epr:
    image: ghcr.io/gareth-power/epr:latest
    build: .                 # only used with `--build`; ignored by `pull`
    container_name: epr
    ports:
      - "8080:8080"          # host:container. Use "127.0.0.1:8080:8080" to stay off the LAN.
                             # If 8080 is taken (e.g. on a Synology), use "8095:8080".
    volumes:
      - ./data:/data         # all patient data. Synology: /volume1/docker/EPR/data:/data
    environment:
      EPR_DATA_DIR: /data
      # Match a host user so bind-mounted files aren't root-owned (Synology: your DSM user):
      # PUID: "1026"
      # PGID: "100"
    restart: unless-stopped
