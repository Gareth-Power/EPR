<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <script src="/shared.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 14px;
            height: 100vh; display: flex; background: #f5f5f5;
        }

        .sidebar { width: 35%; min-width: 260px; background: #fff; border-right: 2px solid #e0e0e0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; background: #fafafa; }
        .new-note-btn {
            background: #a9d1fc; color: #000; width: 100%; padding: 12px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 14px;
        }
        .new-note-btn:hover { background: #7bb8f6; }
        body:not(.admin) .new-note-btn { display: none; }

        .notes-list { flex: 1; overflow-y: auto; padding: 10px; }
        .note-item {
            background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px;
            padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
        }
        .note-item:hover { background: #e9ecef; }
        .note-item.active { background: #a9d1fc; border-color: transparent; }
        .note-header { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
        .note-department { background: #a9d1fc; color: #000; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .note-item.active .note-department { background: rgba(255,255,255,0.8); }
        .note-date { font-size: 11px; color: #6c757d; margin-left: auto; }
        .note-preview {
            font-size: 12px; color: #666; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 0; }
        .content-header { padding: 14px 18px 0; }
        .content-title { font-size: 20px; color: #333; margin-bottom: 8px; }
        .content-meta { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; font-size: 13px; color: #666; }
        .content-meta .meta-label { font-weight: bold; }
        .note-content {
            flex: 1; background: #fff; border: 1px solid #e0e0e0;
            padding: 14px 18px; font-size: 14px; line-height: 1.6;
            resize: none; font-family: inherit; width: 100%;
            white-space: pre-wrap;
        }
        textarea.note-content:focus { outline: none; border-color: #007bff; }

        .welcome-message { text-align: center; color: #666; font-size: 18px; margin-top: 50px; }

        .admin-fields { display: flex; gap: 12px; padding: 12px 18px; align-items: center; flex-wrap: wrap; }
        .admin-fields input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; font: inherit; }
        .admin-fields input.dept { width: 200px; }
        .admin-bar { display: flex; gap: 10px; padding: 10px 18px; border-top: 1px solid #e0e0e0; align-items: center; }
        .admin-bar button { padding: 8px 16px; border: 1px solid #b9c6d6; background: #fff; border-radius: 6px; cursor: pointer; font: inherit; }
        .admin-bar button.primary { background: #a9d1fc; border-color: #a9d1fc; font-weight: 600; }
        .admin-bar button.danger:hover { background: #fdecec; color: #c0392b; }
        .admin-bar .status { font-size: 12px; color: #666; }
        body:not(.admin) .admin-fields, body:not(.admin) .admin-bar { display: none; }
        body.admin .note-content { border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-note-btn" id="newNoteBtn">+ New Note</button>
        </div>
        <div class="notes-list" id="notesList"></div>
    </div>

    <div class="main-content">
        <div id="welcomeMessage" class="welcome-message">Select a note to view</div>
        <div id="noteEditor" style="display:none; flex:1; flex-direction:column; height:100%;">
            <div class="content-header">
                <div class="content-title" id="noteTitle">Note</div>
                <div class="content-meta">
                    <div><span class="meta-label">Department:</span> <span id="noteDepartment">-</span></div>
                    <div><span class="meta-label">Date:</span> <span id="noteDate">-</span></div>
                </div>
            </div>
            <div class="admin-fields">
                <input class="dept" id="fldDept" placeholder="Department">
                <input class="date" id="fldDate" placeholder="Date (e.g. 01/09/2026 or Today)">
            </div>
            <textarea class="note-content" id="noteContent" placeholder="Note content…" readonly></textarea>
            <div class="admin-bar">
                <button class="primary" id="saveNote">Save</button>
                <button class="danger" id="deleteNote">Delete note</button>
                <span class="status" id="status"></span>
            </div>
        </div>
    </div>

    <script>
    (function () {
        var E = window.EPR;
        var SHEET = "notes";
        var header = ["Department", "date", "Note"];
        var notes = [];       // [{department, date, content}]
        var currentIndex = -1;

        if (!E.patientId) {
            document.querySelector(".main-content").innerHTML =
                '<div class="welcome-message">No patient selected.</div>';
            return;
        }
        if (E.ADMIN) document.body.classList.add("admin");

        E.api.sheet(E.patientId, SHEET).then(function (res) {
            var grid = res.grid || [];
            if (grid.length) header = grid[0];
            for (var i = 1; i < grid.length; i++) {
                var row = grid[i] || [];
                notes.push({
                    department: row[0] || "",
                    date: row[1] || "",
                    content: row.slice(2).join(", "),
                });
            }
            renderList();
        }, function (err) {
            document.querySelector(".main-content").innerHTML =
                '<div class="welcome-message">Error loading notes: ' + E.escapeHtml(err.message) + "</div>";
        });

        function fmtDate(s) {
            var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s || "");
            var d = m ? new Date(m[3] + "-" + m[2] + "-" + m[1]) : new Date(s);
            if (isNaN(d)) return s || "";
            return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
        }

        function renderList() {
            var list = document.getElementById("notesList");
            list.innerHTML = "";
            notes.forEach(function (note, idx) {
                var el = document.createElement("div");
                el.className = "note-item" + (idx === currentIndex ? " active" : "");
                el.addEventListener("click", function () { select(idx); });
                var preview = note.content.length > 80 ? note.content.slice(0, 80) + "…" : note.content;
                el.innerHTML =
                    '<div class="note-header">' +
                    '<span class="note-department">' + E.escapeHtml(note.department) + "</span>" +
                    '<span class="note-date">' + E.escapeHtml(fmtDate(note.date)) + "</span>" +
                    "</div>" +
                    '<div class="note-preview">' + E.escapeHtml(preview) + "</div>";
                list.appendChild(el);
            });
        }

        function select(idx) {
            currentIndex = idx;
            var note = notes[idx];
            document.getElementById("welcomeMessage").style.display = "none";
            document.getElementById("noteEditor").style.display = "flex";
            document.getElementById("noteTitle").textContent = note.department || "Note";
            document.getElementById("noteDepartment").textContent = note.department || "-";
            document.getElementById("noteDate").textContent = fmtDate(note.date) || "-";
            var ta = document.getElementById("noteContent");
            ta.value = note.content;
            ta.readOnly = !E.ADMIN;
            document.getElementById("fldDept").value = note.department;
            document.getElementById("fldDate").value = note.date;
            setStatus("");
            renderList();
        }

        function setStatus(msg, err) {
            var s = document.getElementById("status");
            s.textContent = msg || "";
            s.style.color = err ? "#c0392b" : "#666";
        }

        /* ---- admin ---- */
        function gridFromNotes() {
            var out = [header.slice(0, 3)];
            notes.forEach(function (n) { out.push([n.department, n.date, n.content]); });
            return out;
        }

        function persist(after) {
            if (!E.ADMIN) return;          // viewer mode never writes to the database
            setStatus("Saving…");
            E.api.putSheet(E.patientId, SHEET, gridFromNotes()).then(
                function () { setStatus("Saved"); if (after) after(); },
                function (err) { setStatus("Save failed: " + err.message, true); }
            );
        }

        document.getElementById("newNoteBtn").addEventListener("click", function () {
            var today = new Date();
            var d = String(today.getDate()).padStart(2, "0") + "/" +
                    String(today.getMonth() + 1).padStart(2, "0") + "/" + today.getFullYear();
            notes.unshift({ department: "New note", date: d, content: "" });
            renderList();
            select(0);
            persist();
            document.getElementById("fldDept").focus();
        });

        document.getElementById("saveNote").addEventListener("click", function () {
            if (currentIndex < 0) return;
            notes[currentIndex] = {
                department: document.getElementById("fldDept").value,
                date: document.getElementById("fldDate").value,
                content: document.getElementById("noteContent").value,
            };
            persist(function () { renderList(); select(currentIndex); });
        });

        document.getElementById("deleteNote").addEventListener("click", function () {
            if (currentIndex < 0) return;
            if (!confirm("Delete this note?")) return;
            notes.splice(currentIndex, 1);
            currentIndex = -1;
            document.getElementById("noteEditor").style.display = "none";
            document.getElementById("welcomeMessage").style.display = "block";
            renderList();
            persist();
        });
    })();
    </script>
</body>
</html>
